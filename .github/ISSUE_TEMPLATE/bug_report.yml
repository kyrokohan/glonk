name: Bug report
description: Something drew wrong, crashed, hung, or did not do what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. A security problem does not belong in a public issue: use the private form linked in the [security policy](https://github.com/kyrokohan/glonk/blob/main/SECURITY.md).
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw. Paste any error message as it appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: The smallest program or file that shows it
      description: A few lines of Go, or the OBJ and MTL files (zipped) that load or draw wrong. A report with one is much easier to act on.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The glonk version or commit, `go version`, and `echo $COLORTERM $TERM` in the terminal you ran it in.
      value: |
        glonk:
        Go:
        OS:
        Terminal:
        COLORTERM and TERM:
    validations:
      required: true
  - type: checkboxes
    id: not-security
    attributes:
      label: Before you send
      options:
        - label: This is not a security problem.
          required: true
