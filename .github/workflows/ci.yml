name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Never download a different Go than the one a job asked for. Without this, a go.mod
# that needs a newer Go would quietly make the Go 1.26 jobs run on that newer one;
# with it, they fail and say so.
env:
  GOTOOLCHAIN: local

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, vet and the tests with the race detector, on the two systems the
  # terminal handling is written for, with both supported Go releases, except macOS with
  # the older one, which is test-macos-older-go below.
  #
  # A macOS job takes 1 to 2 minutes once it has a runner, and the wait for one has been the
  # longer part: GitHub says jobs on its macOS runners "may take longer to start", and several
  # that never got one were cancelled after 15 minutes. A shorter limit is meant to end such a
  # wait sooner, if the 15 minutes was this limit and not GitHub's.
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 8 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26", "1.27"]
        exclude:
          - os: macos-latest
            go: "1.26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - run: make check

  # The pair left out of test: macOS with the older Go. A pull request does not run it, so that
  # one pull request is exposed to the scarce macOS runners once and not twice; main runs it on
  # every push. The job is the same, apart from the Go and the condition, and keeps the name
  # that the main ruleset requires: a job skipped by its own condition reports success, so the
  # required check is satisfied without a runner. (A whole workflow that is skipped would not
  # be: its checks stay pending.)
  test-macos-older-go:
    name: test (macos-latest, go 1.26)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
      - run: make check

  # Systems the tests cannot run on here are at least compiled and vetted, and the
  # 32-bit build runs natively on the Linux runner.
  cross:
    name: other systems
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      # Each module: glonk, and glonk.dev/sound in sound/.
      - name: go.mod and go.sum are tidy
        run: for mod in . sound; do (cd $mod && go mod tidy -diff) || exit 1; done
      - name: glonk itself needs only x/sys and x/term
        run: test "$(go list -m all | tail -n +2 | cut -d' ' -f1 | tr '\n' ' ')" = "golang.org/x/sys golang.org/x/term "
      # sound plays through oto, whose purego needs one flag to build for FreeBSD without cgo, as
      # oto's README says; a native FreeBSD build, with cgo, needs nothing.
      - name: vet for other systems
        run: |
          for mod in . sound; do
            for target in windows/amd64 freebsd/amd64 darwin/amd64 linux/arm linux/386 js/wasm; do
              echo "go vet ($mod, $target)"
              flags=
              if [ "$target" = freebsd/amd64 ]; then flags=-gcflags=github.com/ebitengine/purego/internal/fakecgo=-std; fi
              (cd $mod && GOOS=${target%/*} GOARCH=${target#*/} go vet $flags ./...) || exit 1
            done
          done
      - name: build for windows
        run: for mod in . sound; do (cd $mod && GOOS=windows go build ./...) || exit 1; done
      - name: test as a 32-bit program
        run: for mod in . sound; do (cd $mod && GOARCH=386 go test ./...) || exit 1; done

  # Mistakes that go vet does not find. The version of the tool is pinned in the Makefile.
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      - run: make lint
